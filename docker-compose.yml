version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: staylytics_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: SistemaPrevencionDesercion
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: staylytics_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # AQUÍ ESTÁ LA CLAVE: Docker inyecta esta URL a tu database.py ignorando tu localhost
      - DATABASE_URL=mysql+pymysql://root:root@db:3306/SistemaPrevencionDesercion

  frontend:
    image: nginx:alpine
    container_name: staylytics_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  db_data: